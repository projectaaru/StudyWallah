services:
  - type: web
    name: studywallah
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: MONGO_DB_NAME
        value: studywallah
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
