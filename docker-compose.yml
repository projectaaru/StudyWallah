services:
  mongodb:
    image: mongo:7.0
    container_name: studywallah-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-studywallah_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-change_me_strong_mongo_password}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-studywallah}
    ports:
      # Bound strictly to localhost so MongoDB is never exposed publicly
      - "127.0.0.1:27017:27017"
    volumes:
      - studywallah_mongo_data:/data/db
      - studywallah_mongo_config:/data/configdb
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "-u",
          "${MONGO_INITDB_ROOT_USERNAME:-studywallah_admin}",
          "-p",
          "${MONGO_INITDB_ROOT_PASSWORD:-change_me_strong_mongo_password}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  studywallah_mongo_data:
    driver: local
  studywallah_mongo_config:
    driver: local
